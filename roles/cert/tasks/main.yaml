- name: Sign of life
  ansible.builtin.set_fact:
    resolved_leaf: "{{ resolved_leaf| combine(
    {
      item: {
        'template': 'mock_template',
        'ca': 'mock_ca',
        'v': {
          'name': 'Generated MOCK ' ~ item,
          'sans': mock[item].server.sans
        }
      }
    } ) }}"
  loop: "{{ mock.keys() }}"
- name: Sign of life
  ansible.builtin.debug:
    msg: "{{ resolved_leaf }}"

#----------------- Build CA work list and execute ----------
- name: Sign of life | CA WORK
  ansible.builtin.set_fact:
    ca_work_config: "{{ ca_work_config | default({}) | combine(
    {
      item: {
        'config': {
            'filename': resolved_roots[item].filename,
            'password': resolved_roots[item].password,
            'alias': item,
            'common_name': resolved_roots[item].name
        }
      }
    } ) }}"
  loop: "{{ resolved_roots.keys() }}"

- name: Do CA
  ansible.builtin.include_role:
    name: ca
  vars:
    config: "{{ ca_work_config[item].values() }}"
  loop: "{{ ca_work_config.keys() }}"
#-----------------------------------------------------------
#
- name: Sign of life | INTERMEDIATE WORK
  ansible.builtin.set_fact:
    intermediate_work_config: "{{ intermediate_work_config | default({}) | combine(
    {
      item: {
        'config': {
            'filename': resolved_intermediate[item].filename,
            'password': resolved_intermediate[item].password,
            'common_name': resolved_intermediate[item].name,
            'alias': item,
            'ca': resolved_intermediate[item].ca
        }
      }
    } ) }}"
  loop: "{{ resolved_intermediate.keys() }}"


- name: Sign of life
  ansible.builtin.debug:
    msg: "{{ intermediate_work_config }}"

- name: Do Intermediates
  ansible.builtin.include_role:
    name: intermediate 
  vars:
    config: "{{ intermediate_work_config[item].values() }}"
  loop: "{{ intermediate_work_config.keys() }}"
