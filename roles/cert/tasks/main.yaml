---
- name: Sign of life
  ansible.builtin.debug:
    msg: "{{ certs }}"


# Some asserts for root ca's
# 1. Must have v child defined
# 2. Must have template child defined
# 3. template child node must refer to valid template name
- name: Verify Roots 
  ansible.builtin.assert:
    that:
      - v_defined_str
      - template_defined_str
      - template_resolved
    fail_msg: "cert root '{{item}}' failed checks 
        [{{v_defined_str}}] v defined
        [{{template_defined_str}}] template defined
        [{{template_resolved}}] resolved
    "
    success_msg: "cert root '{{item}}' passed checks 
        [{{v_defined_str}}] v defined
        [{{template_defined_str}}] template defined
        [{{template_resolved}}] resolved
    "
  vars:
    v_defined_str: "{{(certs.root[item].v is defined) | bool }}"
    template_defined_str: "{{ (certs.root[item].template is defined) | bool }}"
    template_resolved: "{{(certs.templates
        | ansible.builtin.dict2items 
        | selectattr('key', 'in', certs.root[item].template) 
        | length > 0) | bool }}"
  loop: "{{ certs.root.keys() }}"

# Some asserts for intermediate ca's
# 1. Must have v child defined
# 2. Must have template child defined
# 3. template child node must refer to valid template name
# 4. Must have ca child defined
# 5. ca child node must refer to valid root name
- name: Verify Intermediates
  ansible.builtin.assert:
    that:
      - v_defined
      - ca_defined
      - ca_present
      - template_defined
      - template_resolved
    fail_msg: "cert intermediate '{{item}}'
        v_defined[{{v_defined}}]
        ca_defined[{{ca_defined}}]
        ca_present[{{ca_present}}]
        template_defined[{{template_defined}}]
        tempate_resolved[{{template_resolved}}]
    "
    success_msg: "BOOD {{ ca_present }}"
  loop: "{{ certs.intermediate.keys() }}"
  vars:
    v_defined: "{{ (certs.intermediate[item].v is defined) | bool }}"
    ca_defined: "{{ (certs.intermediate[item].ca is defined) | bool }}"
    ca_present: "{{ (certs.root
        | ansible.builtin.dict2items 
        | selectattr('key', 'in', certs.intermediate[item].ca) 
        | length > 0) | bool }}"
    template_defined: "{{ (certs.intermediate[item].template is defined) | bool }}"
    template_resolved: "{{(certs.templates
        | ansible.builtin.dict2items 
        | selectattr('key', 'in', certs.intermediate[item].template) 
        | length > 0) | bool }}"

- name: Verify Leaf
  ansible.builtin.assert:
    that:
      - v_defined
      - ca_defined
      - ca_present or intermediate_present
      - template_defined
      - template_resolved
    fail_msg: "cert leaf '{{item}}'
        v_defined[{{v_defined}}]
        ca_defined[{{ca_defined}}]
        ca_present[{{ca_present}}]
        template_defined[{{template_defined}}]
        tempate_resolved[{{template_resolved}}]
    "
    success_msg: "BOOD {{ ca_present }}"
  loop: "{{ certs.leaf.keys() }}"
  vars:
    v_defined: "{{ (certs.leaf[item].v is defined) | bool }}"
    ca_defined: "{{ (certs.leaf[item].ca is defined) | bool }}"
    ca_present: "{{ (certs.root
        | ansible.builtin.dict2items 
        | selectattr('key', 'in', certs.leaf[item].ca) 
        | length > 0) | bool }}"
    intermediate_present: "{{ (certs.intermediate
        | ansible.builtin.dict2items 
        | selectattr('key', 'in', certs.leaf[item].ca) 
        | length > 0) | bool }}"
    template_defined: "{{ (certs.leaf[item].template is defined) | bool }}"
    template_resolved: "{{(certs.templates
        | ansible.builtin.dict2items 
        | selectattr('key', 'in', certs.leaf[item].template) 
        | length > 0) | bool }}"



- name: Sign of life
  ansible.builtin.set_fact:
    resolved_roots: {}

- name: Sign of life
  ansible.builtin.set_fact:
    resolved_roots: "{{ resolved_roots | combine( { item: merged_keys } ) }}"
  loop: "{{ certs.root.keys() }}"
  vars:
    template: "{{ (
        certs.templates 
        | ansible.builtin.dict2items 
        | selectattr('key', 'in', certs.root[item].template) 
        | first 
        ).value }}"
    merged_keys: "{{
      certs.root[item].v 
      | combine( template, recursive=True )
    }}"

- name: Sign of life
  ansible.builtin.set_fact:
    resolved_intermediate: {}

# Resolve intermediates
- name: Sign of life
  ansible.builtin.set_fact:
    resolved_intermediate: "{{ resolved_intermediate| combine( { item: merged_keys } ) }}"
  loop: "{{ certs.intermediate.keys() }}"
  vars:
    template: "{{ (
        certs.templates 
        | ansible.builtin.dict2items 
        | selectattr('key', 'in', certs.intermediate[item].template) 
        | first 
        ).value }}"
    resolved_ca: "{{ (
        resolved_roots 
        | ansible.builtin.dict2items 
        | selectattr('key', 'in', certs.intermediate[item].ca) 
        | first 
        ).value }}"

    merged_keys: "{{
      certs.intermediate[item].v 
      | combine( template, recursive=True )
      | combine( { 'ca' : resolved_ca })
    }}"

- name: Sign of life
  ansible.builtin.set_fact:
    resolved_leaf: {}

- name: Sign of life
  ansible.builtin.set_fact:
    resolved_leaf: "{{ resolved_leaf| combine( { item: merged_keys } ) }}"
  loop: "{{ certs.leaf.keys() }}"
  vars:
    template: "{{ (
        certs.templates 
        | ansible.builtin.dict2items 
        | selectattr('key', 'in', certs.leaf[item].template) 
        | first 
        ).value }}"
    resolved_ca: "{{ (
        resolved_roots 
        | ansible.builtin.dict2items 
        | selectattr('key', 'in', certs.leaf[item].ca) 
        | first 
        ).value }}"

    merged_keys: "{{
      certs.leaf[item].v 
      | combine( template, recursive=True )
      | combine( { 'ca' : resolved_ca })
    }}"
  when: resolved_roots 
        | ansible.builtin.dict2items 
        | selectattr('key', 'in', certs.leaf[item].ca) 
        | length > 0

- name: Sign of life
  ansible.builtin.set_fact:
    resolved_leaf: "{{ resolved_leaf| combine( { item: merged_keys } ) }}"
  loop: "{{ certs.leaf.keys() }}"
  vars:
    template: "{{ (
        certs.templates 
        | ansible.builtin.dict2items 
        | selectattr('key', 'in', certs.leaf[item].template) 
        | first 
        ).value }}"
    resolved_ca: "{{ (
        resolved_intermediate 
        | ansible.builtin.dict2items 
        | selectattr('key', 'in', certs.leaf[item].ca) 
        | first 
        ).value }}"

    merged_keys: "{{
      certs.leaf[item].v 
      | combine( template, recursive=True )
      | combine( { 'ca' : resolved_ca })
    }}"
  when: resolved_intermediate 
        | ansible.builtin.dict2items 
        | selectattr('key', 'in', certs.leaf[item].ca) 
        | length > 0

- name: Sign of life
  ansible.builtin.debug:
    msg: "{{ resolved_roots }}"

- name: Sign of life
  ansible.builtin.debug:
    msg: "{{ resolved_intermediate }}"

- name: Sign of life
  ansible.builtin.debug:
    msg: "{{ resolved_leaf }}"


- name: Sign of life
  ansible.builtin.set_fact:
    resolved_leaf: "{{ resolved_leaf| combine(
    {
      item: {
        'template': 'mock_template',
        'ca': 'mock_ca',
        'v': {
          'name': 'Generated MOCK ' ~ item,
          'sans': mock[item].server.sans
        }
      }
    } ) }}"
  loop: "{{ mock.keys() }}"

- name: Sign of life
  ansible.builtin.debug:
    msg: "{{ resolved_leaf }}"

