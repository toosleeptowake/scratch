# It would be good to be able to include ca in template


certs:
  templates:
    template_1:
      template1_key1: "one"
    template_2:
      name: "template_2 name"
      template2_key2: "two"
    user_template:
      user_template_key: "I am a value"
      password: "user_password"
    mock_template:
      mock_templatekey: "I am a mock template"
      password: "mock_password"
  root:
    internal:
      template: template_2
      v:
        name: "Internal root CA"
        filename: internal.p12
        password: "myinternalpass"
    another:
      v:
        filename: another.p12
        password: "myinternalpass"

      template: template_2
  intermediate:
    orga:
      ca: internal1
      template: template_1
      v:
        name: "Intermediate root ca"
        filename: intermediate.p12
        password: "myintermediatepass"
    orgb:
      ca: internal1
      template: template_1
      v:
        name: "Intermediate root ca 2"
        filename: intermediate2.p12
        password: "myintermediatepass"
  leaf:
    clientA:
      ca: internal
      template: user_template
      v:
        name: "I am a user with name clientA"
        filename: clientA.p12
    clientB:
      ca: orga
      template: user_template
      v:
        name: "I am a user with name clientB"
        filename: clientB.p12
mock:
  serviceA:
    cert_template: mock_template
    client:
    server:
      sans:
        - http://this.com

  serviceB:
    cert_template: mock_template
    client:
    server:
      sans:
        - http://this.com
