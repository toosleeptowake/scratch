- name: Set Role Fact
  ansible.builtin.set_fact:
    _merged_config: "{{ merged_config }}"


- name: Generate Self-Signed Root CA
  block:
    - name: Ensure target directory exists for CA files
      ansible.builtin.file:
        path: "{{ merged_config.outputDir }}"
        state: directory
        mode: '0700'

    - name: 1. Generate CA Private Key (RSA 4096)
      community.crypto.openssl_privatekey:
        path: "{{ merged_config.outputDir }}/{{ merged_config.filename}}.key"
        passphrase: "{{ merged_config.password }}"
        size: 4096
        type: RSA
        mode: '0600'

    - name: 2. Generate Certificate Signing Request (CSR) for Root CA
      community.crypto.openssl_csr_pipe:
        privatekey_path: "{{ merged_config.outputDir }}/{{ merged_config.filename}}.key"
        privatekey_passphrase: "{{ merged_config.password }}"
        common_name: "{{ merged_config.common_name }}"
        use_common_name_for_san: false
        basic_constraints:
          - 'CA:TRUE'
        basic_constraints_critical: true
        key_usage:
          - keyCertSign
          - cRLSign
        key_usage_critical: true
      register: ca_csr

    - name: 3. Generate Self-Signed Root CA Certificate from CSR
      community.crypto.x509_certificate:
        path: "{{ merged_config.outputDir }}/{{ merged_config.filename}}.crt"
        csr_content: "{{ ca_csr.csr }}"
        privatekey_path: "{{ merged_config.outputDir }}/{{ merged_config.filename}}.key"
        privatekey_passphrase: "{{ merged_config.password }}"
        provider: selfsigned
        selfsigned_not_after: "+3650d" # Valid for 10 years
        mode: '0644'

    - name: dump cfg
      ansible.builtin.debug:
        msg: "{{ config }}"

    - name: dump cfg
      ansible.builtin.debug:
        msg: "{{ merged_config }}"

    - name: dump cfg
      ansible.builtin.debug:
        msg: "{{ _merged_config }}"

    - name: 4. Pack Private Key and Certificate into a P12 Archive
      community.crypto.openssl_pkcs12:
        path: "{{ merged_config.outputDir }}/{{ merged_config.filename}}"
        action: export
        certificate_path: "{{ merged_config.outputDir }}/{{ merged_config.filename}}.crt"
        privatekey_path: "{{ merged_config.outputDir }}//{{ merged_config.filename}}.key"
        privatekey_passphrase: "{{ merged_config.password }}"
        passphrase: "{{ merged_config.password }}"
        friendly_name: "{{ merged_config.alias }}"
        state: present

  delegate_to: localhost
